name: Real Market Gateway Smoke Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Acquire and verify real development data
        shell: python
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.twelvedata_api }}
        run: |
          import json
          import sys
          from pathlib import Path
          from sc_rd.market_data import acquire, verify_cache, run_verified_lab, run_verified_portfolio
          from sc_rd.providers.twelve_data import ProviderError

          request = dict(provider_symbol="AAPL", exchange="NASDAQ", mic_code="XNGS", currency="USD",
                         instrument_type="Common Stock", timeframe="15min", adjustment_policy="none",
                         start="2026-09-23T13:30:00+00:00", end="2026-09-23T19:45:00+00:00", max_age_seconds=604800)
          try:
              cache = acquire(request, Path("data/cache"))
              manifest = verify_cache(cache)
              lab = run_verified_lab(cache, "examples/cloud_lab.json", "reports/real-lab")
              lab_result = json.loads((lab / "results.json").read_text())
              config = json.loads(Path("examples/portfolio.json").read_text())
              config["datasets"] = {"AAPL": "unused"}
              for experiment in config["experiments"]:
                  for allocation in experiment["allocations"]:
                      allocation["symbol"] = "AAPL"
              spec = Path("reports/real-portfolio-config.json")
              spec.write_text(json.dumps(config))
              portfolio = run_verified_portfolio(cache, spec, "reports/real-portfolio")
              portfolio_result = json.loads((portfolio / "results.json").read_text())
              if lab_result["final_holdout"] is not None or portfolio_result["holdout_status"] != "withheld":
                  raise RuntimeError("holdout guard failed")
              if not all(e["final"]["reconciled"] for e in portfolio_result["experiments"]):
                  raise RuntimeError("reconciliation failed")
              summary = {k: manifest[k] for k in ("data_classification", "quality_status", "provider_symbol", "timeframe", "row_count", "dataset_sha256", "acquired_at", "first_candle", "last_candle", "mapping_status")}
              summary.update(smoke_status="PASS", holdout="withheld", research_status="PROVISIONAL", lab_run=lab_result["run_id"], portfolio_run=portfolio_result["run_id"])
              print("REAL MARKET SMOKE OK")
              print(json.dumps(summary, sort_keys=True))
          except ProviderError as exc:
              print("REAL MARKET SMOKE FAILED: " + str(exc))
              sys.exit(1)
          except Exception as exc:
              safe = {"provider identity or timeframe mismatch", "missing bars or requested coverage not satisfied", "incomplete or stale dataset for the requested experiment", "empty or malformed dataset", "duplicate timestamps", "non-monotonic timestamps", "nonpositive or nonfinite price", "invalid OHLC geometry"}
              reason = str(exc) if str(exc) in safe else type(exc).__name__
              print("REAL MARKET SMOKE REJECTED: " + reason)
              sys.exit(1)
